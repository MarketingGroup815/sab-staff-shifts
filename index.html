<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spur Labor Optimizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;Spur Optimizer&quot;,&quot;short_name&quot;:&quot;Optimizer&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#000000&quot;,&quot;theme_color&quot;:&quot;#000000&quot;}">
    <style>
        body { background-color: #050505; color: #e5e5e5; }
        .input-glow:focus { box-shadow: 0 0 15px rgba(255, 210, 0, 0.3); border-color: #FFD200; outline: none; }
    </style>
</head>
<body class="p-4 md:p-8 font-sans antialiased min-h-screen flex flex-col items-center">

    <div class="w-full max-w-md bg-[#111] border border-gray-800 rounded-xl shadow-2xl p-6">
        <h1 class="text-2xl font-bold text-[#FFD200] mb-6 tracking-tight">Shift Optimizer</h1>
        
        <div class="mb-6">
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Projected Daily Turnover (ZAR)</label>
            <div class="relative">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 font-bold">R</span>
                <input type="number" id="turnoverInput" class="w-full bg-[#1a1a1a] border border-gray-700 rounded-lg py-3 pl-10 pr-4 text-xl font-bold text-white input-glow transition-all" placeholder="0" inputmode="numeric">
            </div>
        </div>

        <div id="results" class="space-y-4 hidden">
            <!-- FOH Block -->
            <div class="bg-[#1a1a1a] rounded-lg p-4 border border-gray-800">
                <div class="flex justify-between items-end mb-3">
                    <h2 class="text-lg font-bold text-white">Front of House</h2>
                    <span id="fohBudget" class="text-sm font-mono text-emerald-400"></span>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-[#222] p-3 rounded-md text-center">
                        <div id="fohStandard" class="text-2xl font-bold text-[#FFD200]">0</div>
                        <div class="text-xs text-gray-400 uppercase tracking-wide">7Hr Shifts</div>
                    </div>
                    <div class="bg-[#222] p-3 rounded-md text-center">
                        <div id="fohDouble" class="text-2xl font-bold text-[#FFD200]">0</div>
                        <div class="text-xs text-gray-400 uppercase tracking-wide">11Hr Shifts</div>
                    </div>
                </div>
                <div id="fohMetrics" class="text-xs text-gray-500 mt-3 text-right font-mono"></div>
            </div>

            <!-- BOH Block -->
            <div class="bg-[#1a1a1a] rounded-lg p-4 border border-gray-800">
                <div class="flex justify-between items-end mb-3">
                    <h2 class="text-lg font-bold text-white">Back of House</h2>
                    <span id="bohBudget" class="text-sm font-mono text-emerald-400"></span>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-[#222] p-3 rounded-md text-center">
                        <div id="bohStandard" class="text-2xl font-bold text-[#FFD200]">0</div>
                        <div class="text-xs text-gray-400 uppercase tracking-wide">7Hr Shifts</div>
                    </div>
                    <div class="bg-[#222] p-3 rounded-md text-center">
                        <div id="bohDouble" class="text-2xl font-bold text-[#FFD200]">0</div>
                        <div class="text-xs text-gray-400 uppercase tracking-wide">11Hr Shifts</div>
                    </div>
                </div>
                <div id="bohMetrics" class="text-xs text-gray-500 mt-3 text-right font-mono"></div>
            </div>

            <!-- Global Metrics -->
            <div id="globalMetrics" class="text-center text-xs text-gray-500 pt-2 font-mono"></div>
        </div>
    </div>

    <script>
        const CONSTANTS = {
            wagePercentageCap: 0.10,
            fohSplit: 0.55,
            bohSplit: 0.45,
            hourlyRate: 30.23,
            stdShift: 7,
            dblShift: 11,
            maxStaff: 16
        };

        const input = document.getElementById('turnoverInput');
        const results = document.getElementById('results');

        // Integer optimization algorithm prioritizing hours fulfillment
        function optimizeShifts(targetHours) {
            let bestDiff = Infinity;
            let bestS = 0;
            let bestD = 0;

            for (let bodies = 1; bodies <= CONSTANTS.maxStaff; bodies++) {
                for (let d = 0; d <= bodies; d++) {
                    let s = bodies - d;
                    let hours = (s * CONSTANTS.stdShift) + (d * CONSTANTS.dblShift);
                    let diff = hours - targetHours;

                    // Bias toward service capacity: accept the tightest positive variance
                    if (diff >= 0 && diff < bestDiff) {
                        bestDiff = diff;
                        bestS = s;
                        bestD = d;
                    }
                }
            }

            // Fallback if target hours exceed the 176 hour physical limit (16 staff * 11 hrs)
            if (bestDiff === Infinity) {
                bestS = 0;
                bestD = CONSTANTS.maxStaff;
            }

            return { standard: bestS, double: bestD, totalHours: (bestS * CONSTANTS.stdShift) + (bestD * CONSTANTS.dblShift), bodies: bestS + bestD };
        }

        input.addEventListener('input', (e) => {
            const turnover = parseFloat(e.target.value);
            
            if (!turnover || turnover < 1000) {
                results.classList.add('hidden');
                return;
            }

            results.classList.remove('hidden');

            const totalBudget = turnover * CONSTANTS.wagePercentageCap;
            const fohBudget = totalBudget * CONSTANTS.fohSplit;
            const bohBudget = totalBudget * CONSTANTS.bohSplit;

            const fohTargetHours = fohBudget / CONSTANTS.hourlyRate;
            const bohTargetHours = bohBudget / CONSTANTS.hourlyRate;

            const fohRoster = optimizeShifts(fohTargetHours);
            const bohRoster = optimizeShifts(bohTargetHours);

            // Update UI
            document.getElementById('fohBudget').textContent = `Budget: R${fohBudget.toFixed(2)}`;
            document.getElementById('fohStandard').textContent = fohRoster.standard;
            document.getElementById('fohDouble').textContent = fohRoster.double;
            document.getElementById('fohMetrics').textContent = `${fohRoster.totalHours} Hrs Scheduled / ${fohRoster.bodies} Staff`;

            document.getElementById('bohBudget').textContent = `Budget: R${bohBudget.toFixed(2)}`;
            document.getElementById('bohStandard').textContent = bohRoster.standard;
            document.getElementById('bohDouble').textContent = bohRoster.double;
            document.getElementById('bohMetrics').textContent = `${bohRoster.totalHours} Hrs Scheduled / ${bohRoster.bodies} Staff`;

            const totalSpend = (fohRoster.totalHours + bohRoster.totalHours) * CONSTANTS.hourlyRate;
            const actualPerc = ((totalSpend / turnover) * 100).toFixed(2);
            document.getElementById('globalMetrics').innerHTML = `Projected Wage Spend: R${totalSpend.toFixed(2)} <br> Actual Wage/Turnover Ratio: ${actualPerc}%`;
        });
    </script>
</body>
</html>
