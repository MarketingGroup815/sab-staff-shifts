<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weekly Roster Optimizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;Spur Roster&quot;,&quot;short_name&quot;:&quot;Roster&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#050505&quot;,&quot;theme_color&quot;:&quot;#050505&quot;}">
    <style>
        body { background-color: #050505; color: #e5e5e5; }
        .input-glow:focus { box-shadow: 0 0 10px rgba(255, 210, 0, 0.2); border-color: #FFD200; outline: none; }
        /* Print optimizations for the PDF */
        .pdf-mode { background-color: #ffffff !important; color: #000000 !important; padding: 20px !important; }
        .pdf-mode .bg-[#1a1a1a], .pdf-mode .bg-[#222] { background-color: #f3f4f6 !important; border-color: #d1d5db !important; color: #000 !important; }
        .pdf-mode .text-white, .pdf-mode .text-emerald-400, .pdf-mode .text-[#FFD200] { color: #000000 !important; }
        .pdf-mode input { background-color: transparent !important; border: none !important; color: #000 !important; font-weight: bold; }
        .pdf-mode .limit-container { display: none !important; }
    </style>
</head>
<body class="p-4 md:p-8 font-sans antialiased min-h-screen flex flex-col items-center">

    <div class="w-full max-w-5xl">
        <!-- Controls -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <h1 class="text-2xl font-bold text-[#FFD200] tracking-tight">Weekly Roster Optimizer</h1>
            <button onclick="downloadPDF()" class="bg-[#FFD200] text-black font-bold py-2 px-6 rounded-lg hover:bg-yellow-500 transition-colors shadow-[0_0_15px_rgba(255,210,0,0.4)]">
                Download PDF
            </button>
        </div>

        <!-- PDF Export Container -->
        <div id="export-container" class="bg-[#111] border border-gray-800 rounded-xl shadow-2xl p-6">
            
            <!-- Date Range -->
            <div class="grid grid-cols-2 gap-4 mb-6 pb-6 border-b border-gray-800">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Week Starting</label>
                    <input type="date" id="dateFrom" class="w-full bg-[#1a1a1a] border border-gray-700 rounded-lg py-2 px-4 text-white input-glow">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Week Ending</label>
                    <input type="date" id="dateTo" class="w-full bg-[#1a1a1a] border border-gray-700 rounded-lg py-2 px-4 text-white input-glow">
                </div>
            </div>

            <!-- Headers -->
            <div class="hidden md:grid grid-cols-12 gap-4 mb-2 text-xs font-semibold text-gray-400 uppercase tracking-wider px-2">
                <div class="col-span-2">Day</div>
                <div class="col-span-2">Turnover (R)</div>
                <div class="col-span-4 text-center border-l border-gray-800">Front of House</div>
                <div class="col-span-4 text-center border-l border-gray-800">Back of House</div>
            </div>

            <!-- Dynamic Weekly Grid -->
            <div id="weeklyGrid" class="space-y-4 md:space-y-2"></div>

            <!-- Weekly Totals -->
            <div class="mt-6 pt-4 border-t border-gray-800 text-right">
                <div id="weeklySummary" class="text-sm font-mono text-gray-400">Total Projected Wage Spend: R0.00 | Aggregate Ratio: 0.00%</div>
            </div>
        </div>
    </div>

    <script>
        const CONSTANTS = {
            wagePercentageCap: 0.10,
            fohSplit: 0.55,
            bohSplit: 0.45,
            hourlyRate: 30.23,
            stdShift: 7,
            dblShift: 11,
            maxStaff: 16
        };

        const daysOfWeek = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
        const grid = document.getElementById('weeklyGrid');

        // Initialize UI
        function buildGrid() {
            daysOfWeek.forEach(day => {
                const row = document.createElement('div');
                row.className = "grid grid-cols-1 md:grid-cols-12 gap-4 items-center bg-[#1a1a1a] p-4 md:p-2 rounded-lg border border-gray-800";
                row.innerHTML = `
                    <div class="col-span-2 font-bold text-white">${day}</div>
                    <div class="col-span-2 relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 font-bold">R</span>
                        <input type="number" id="turnover-${day}" data-day="${day}" class="trigger-calc w-full bg-[#222] border border-gray-700 rounded py-2 pl-8 pr-2 text-white font-mono input-glow" placeholder="0">
                    </div>
                    
                    <!-- FOH Output -->
                    <div class="col-span-4 md:border-l border-gray-800 pl-0 md:pl-4 flex flex-col justify-center text-sm">
                        <div class="flex justify-between items-center mb-1">
                            <div class="limit-container text-[10px] text-gray-500 uppercase flex items-center gap-1">
                                Max 11h: <input type="number" min="0" max="16" value="16" id="foh-limit-${day}" data-day="${day}" class="trigger-calc w-10 bg-[#222] border border-gray-700 rounded text-center text-white text-[10px] h-5">
                            </div>
                            <div id="foh-bgt-${day}" class="text-emerald-400 font-mono text-xs text-right">R0</div>
                        </div>
                        <div class="bg-[#222] rounded py-2 flex flex-col items-center justify-center border border-gray-800">
                            <div class="text-[#FFD200] font-bold text-2xl leading-none" id="foh-slots-${day}">0</div>
                            <div class="text-[10px] text-gray-400 uppercase tracking-widest mt-1">Total Shift Slots</div>
                            <div class="text-[10px] text-gray-500 mt-1 font-mono" id="foh-breakdown-${day}">(0 x 7h  |  0 x 11h)</div>
                        </div>
                    </div>

                    <!-- BOH Output -->
                    <div class="col-span-4 md:border-l border-gray-800 pl-0 md:pl-4 flex flex-col justify-center text-sm">
                        <div class="flex justify-between items-center mb-1">
                            <div class="limit-container text-[10px] text-gray-500 uppercase flex items-center gap-1">
                                Max 11h: <input type="number" min="0" max="16" value="16" id="boh-limit-${day}" data-day="${day}" class="trigger-calc w-10 bg-[#222] border border-gray-700 rounded text-center text-white text-[10px] h-5">
                            </div>
                            <div id="boh-bgt-${day}" class="text-emerald-400 font-mono text-xs text-right">R0</div>
                        </div>
                        <div class="bg-[#222] rounded py-2 flex flex-col items-center justify-center border border-gray-800">
                            <div class="text-[#FFD200] font-bold text-2xl leading-none" id="boh-slots-${day}">0</div>
                            <div class="text-[10px] text-gray-400 uppercase tracking-widest mt-1">Total Shift Slots</div>
                            <div class="text-[10px] text-gray-500 mt-1 font-mono" id="boh-breakdown-${day}">(0 x 7h  |  0 x 11h)</div>
                        </div>
                    </div>
                `;
                grid.appendChild(row);
            });
        }

        function optimizeShifts(targetHours, maxDoubleAllowed) {
            let bestDiff = Infinity, bestS = 0, bestD = 0;
            for (let bodies = 1; bodies <= CONSTANTS.maxStaff; bodies++) {
                let currentMaxDouble = Math.min(bodies, maxDoubleAllowed);
                for (let d = 0; d <= currentMaxDouble; d++) {
                    let s = bodies - d;
                    let hours = (s * CONSTANTS.stdShift) + (d * CONSTANTS.dblShift);
                    let diff = hours - targetHours;
                    
                    if (diff >= 0 && diff < bestDiff) { 
                        bestDiff = diff; 
                        bestS = s; 
                        bestD = d; 
                    }
                }
            }
            if (bestDiff === Infinity) { 
                bestS = CONSTANTS.maxStaff - Math.min(CONSTANTS.maxStaff, maxDoubleAllowed); 
                bestD = Math.min(CONSTANTS.maxStaff, maxDoubleAllowed); 
            }
            return { standard: bestS, double: bestD, totalHours: (bestS * CONSTANTS.stdShift) + (bestD * CONSTANTS.dblShift) };
        }

        function calculateTotals() {
            let totalTurnover = 0;
            let totalSpend = 0;

            daysOfWeek.forEach(day => {
                const turnoverInput = document.getElementById(`turnover-${day}`);
                if(turnoverInput) totalTurnover += (parseFloat(turnoverInput.value) || 0);
            });

            if (totalTurnover > 0) {
                totalSpend = totalTurnover * CONSTANTS.wagePercentageCap;
                const ratio = ((totalSpend / totalTurnover) * 100).toFixed(2);
                document.getElementById('weeklySummary').textContent = `Total Projected Wage Spend: R${totalSpend.toFixed(2)} | Aggregate Ratio: ${ratio}%`;
            } else {
                document.getElementById('weeklySummary').textContent = `Total Projected Wage Spend: R0.00 | Aggregate Ratio: 0.00%`;
            }
        }

        function processRow(day) {
            const turnover = parseFloat(document.getElementById(`turnover-${day}`).value) || 0;
            
            const fohLimit = parseInt(document.getElementById(`foh-limit-${day}`).value);
            const bohLimit = parseInt(document.getElementById(`boh-limit-${day}`).value);
            const maxFohDbl = isNaN(fohLimit) ? CONSTANTS.maxStaff : fohLimit;
            const maxBohDbl = isNaN(bohLimit) ? CONSTANTS.maxStaff : bohLimit;

            if (turnover < 1000) {
                document.getElementById(`foh-slots-${day}`).textContent = "0";
                document.getElementById(`foh-breakdown-${day}`).textContent = "(0 x 7h | 0 x 11h)";
                document.getElementById(`foh-bgt-${day}`).textContent = "R0";

                document.getElementById(`boh-slots-${day}`).textContent = "0";
                document.getElementById(`boh-breakdown-${day}`).textContent = "(0 x 7h | 0 x 11h)";
                document.getElementById(`boh-bgt-${day}`).textContent = "R0";
            } else {
                const totalBudget = turnover * CONSTANTS.wagePercentageCap;
                const fohBudget = totalBudget * CONSTANTS.fohSplit;
                const bohBudget = totalBudget * CONSTANTS.bohSplit;

                const fohRoster = optimizeShifts(fohBudget / CONSTANTS.hourlyRate, maxFohDbl);
                const bohRoster = optimizeShifts(bohBudget / CONSTANTS.hourlyRate, maxBohDbl);

                // Calculate Total Shift Slots (Standard = 1 slot, Double = 2 slots)
                const fohSlots = fohRoster.standard + (fohRoster.double * 2);
                const bohSlots = bohRoster.standard + (bohRoster.double * 2);

                document.getElementById(`foh-slots-${day}`).textContent = fohSlots;
                document.getElementById(`foh-breakdown-${day}`).textContent = `(${fohRoster.standard} x 7h  |  ${fohRoster.double} x 11h)`;
                document.getElementById(`foh-bgt-${day}`).textContent = `R${Math.round(fohBudget)}`;

                document.getElementById(`boh-slots-${day}`).textContent = bohSlots;
                document.getElementById(`boh-breakdown-${day}`).textContent = `(${bohRoster.standard} x 7h  |  ${bohRoster.double} x 11h)`;
                document.getElementById(`boh-bgt-${day}`).textContent = `R${Math.round(bohBudget)}`;
            }
            calculateTotals();
        }

        grid.addEventListener('input', (e) => {
            if (e.target.classList.contains('trigger-calc')) {
                const day = e.target.getAttribute('data-day');
                processRow(day);
            }
        });

        function downloadPDF() {
            const element = document.getElementById('export-container');
            const dateFrom = document.getElementById('dateFrom').value || 'Unknown';
            const dateTo = document.getElementById('dateTo').value || 'Unknown';
            
            element.classList.add('pdf-mode');

            const opt = {
                margin:       10,
                filename:     `Spur_Roster_${dateFrom}_to_${dateTo}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                element.classList.remove('pdf-mode');
            });
        }

        buildGrid();
    </script>
</body>
</html>
