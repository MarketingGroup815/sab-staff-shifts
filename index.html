<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weekly Roster Optimizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;Spur Roster&quot;,&quot;short_name&quot;:&quot;Roster&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#050505&quot;,&quot;theme_color&quot;:&quot;#050505&quot;}">
    <style>
        body { background-color: #050505; color: #e5e5e5; }
        .input-glow:focus { box-shadow: 0 0 10px rgba(255, 210, 0, 0.2); border-color: #FFD200; outline: none; }
    </style>
</head>
<body class="p-4 md:p-8 font-sans antialiased min-h-screen flex flex-col items-center">

    <!-- Hidden Logo Asset for PDF Generation -->
    <img id="pdfLogo" src="logo.png" alt="Logo" style="display: none;" crossorigin="anonymous">

    <div class="w-full max-w-5xl">
        <!-- Controls -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <h1 class="text-2xl font-bold text-[#FFD200] tracking-tight">Weekly Roster Optimizer</h1>
            <button onclick="downloadPDF()" class="bg-[#FFD200] text-black font-bold py-2 px-6 rounded-lg hover:bg-yellow-500 transition-colors shadow-[0_0_15px_rgba(255,210,0,0.4)]">
                Download PDF
            </button>
        </div>

        <!-- App Container -->
        <div class="bg-[#111] border border-gray-800 rounded-xl shadow-2xl p-6">
            
            <!-- Date Range -->
            <div class="grid grid-cols-2 gap-4 mb-6 pb-6 border-b border-gray-800">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Week Starting</label>
                    <input type="date" id="dateFrom" class="w-full bg-[#1a1a1a] border border-gray-700 rounded-lg py-2 px-4 text-white input-glow">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Week Ending</label>
                    <input type="date" id="dateTo" class="w-full bg-[#1a1a1a] border border-gray-700 rounded-lg py-2 px-4 text-white input-glow">
                </div>
            </div>

            <!-- Headers -->
            <div class="hidden md:grid grid-cols-12 gap-4 mb-2 text-xs font-semibold text-gray-400 uppercase tracking-wider px-2">
                <div class="col-span-2">Day</div>
                <div class="col-span-2">Turnover (R)</div>
                <div class="col-span-4 text-center border-l border-gray-800">Front of House</div>
                <div class="col-span-4 text-center border-l border-gray-800">Back of House</div>
            </div>

            <!-- Dynamic Weekly Grid -->
            <div id="weeklyGrid" class="space-y-4 md:space-y-2"></div>

            <!-- Weekly Totals -->
            <div class="mt-6 pt-4 border-t border-gray-800 text-center md:text-right">
                <div id="weeklySummary" class="text-sm font-mono text-gray-400 tracking-tight">
                    Total Turnover: <span class="text-white">R0.00</span> &nbsp;|&nbsp; Actual Wage Spend: <span class="text-white">R0.00</span> &nbsp;|&nbsp; Actual Ratio: <span class="text-emerald-400">0.00%</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CONSTANTS = {
            wagePercentageCap: 0.10,
            fohSplit: 0.52,
            bohSplit: 0.48,
            hourlyRate: 30.23,
            stdShift: 7,
            dblShift: 11,
            maxFohStaff: 17,
            maxBohStaff: 16
        };

        const daysOfWeek = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
        const grid = document.getElementById('weeklyGrid');

        // Initialize UI
        function buildGrid() {
            daysOfWeek.forEach(day => {
                const row = document.createElement('div');
                row.className = "grid grid-cols-1 md:grid-cols-12 gap-4 items-center bg-[#1a1a1a] p-4 md:p-2 rounded-lg border border-gray-800";
                row.innerHTML = `
                    <div class="col-span-2 font-bold text-white">${day}</div>
                    <div class="col-span-2 relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 font-bold">R</span>
                        <input type="number" id="turnover-${day}" data-day="${day}" class="trigger-calc w-full bg-[#222] border border-gray-700 rounded py-2 pl-8 pr-2 text-white font-mono input-glow" placeholder="0">
                    </div>
                    
                    <!-- FOH Output -->
                    <div class="col-span-4 md:border-l border-gray-800 pl-0 md:pl-4 flex flex-col justify-center text-sm">
                        <div class="flex justify-between items-center mb-1">
                            <div class="text-[10px] text-gray-500 uppercase flex items-center gap-1">
                                11h Shifts: <input type="number" min="0" max="${CONSTANTS.maxFohStaff}" value="0" id="foh-limit-${day}" data-day="${day}" class="trigger-calc w-10 bg-[#222] border border-gray-700 rounded text-center text-white text-[10px] h-5">
                            </div>
                            <div id="foh-bgt-${day}" class="text-emerald-400 font-mono text-xs text-right hidden md:block">R0</div>
                        </div>
                        <div class="bg-[#222] rounded py-2 flex flex-col items-center justify-center border border-gray-800">
                            <div class="text-[#FFD200] font-bold text-xl leading-none" id="foh-staff-${day}" data-hours="0">0</div>
                            <div class="text-[10px] text-gray-400 uppercase tracking-widest mt-1">Total Staff</div>
                            <div class="text-sm text-gray-300 mt-1 font-mono font-semibold" id="foh-breakdown-${day}">(0 x 7h  |  0 x 11h)</div>
                        </div>
                    </div>

                    <!-- BOH Output -->
                    <div class="col-span-4 md:border-l border-gray-800 pl-0 md:pl-4 flex flex-col justify-center text-sm">
                        <div class="flex justify-between items-center mb-1">
                            <div class="text-[10px] text-gray-500 uppercase flex items-center gap-1">
                                11h Shifts: <input type="number" min="0" max="${CONSTANTS.maxBohStaff}" value="0" id="boh-limit-${day}" data-day="${day}" class="trigger-calc w-10 bg-[#222] border border-gray-700 rounded text-center text-white text-[10px] h-5">
                            </div>
                            <div id="boh-bgt-${day}" class="text-emerald-400 font-mono text-xs text-right hidden md:block">R0</div>
                        </div>
                        <div class="bg-[#222] rounded py-2 flex flex-col items-center justify-center border border-gray-800">
                            <div class="text-[#FFD200] font-bold text-xl leading-none" id="boh-staff-${day}" data-hours="0">0</div>
                            <div class="text-[10px] text-gray-400 uppercase tracking-widest mt-1">Total Staff</div>
                            <div class="text-sm text-gray-300 mt-1 font-mono font-semibold" id="boh-breakdown-${day}">(0 x 7h  |  0 x 11h)</div>
                        </div>
                    </div>
                `;
                grid.appendChild(row);
            });
        }

        function optimizeShiftsExact(targetHours, exactDouble, departmentStaffMax) {
            let d = Math.min(Math.max(0, exactDouble), departmentStaffMax);
            let bestDiff = Infinity, bestS = 0;
            let maxS = departmentStaffMax - d;

            for (let s = 0; s <= maxS; s++) {
                let hours = (s * CONSTANTS.stdShift) + (d * CONSTANTS.dblShift);
                let diff = hours - targetHours;
                
                if (diff >= 0 && diff < bestDiff) { 
                    bestDiff = diff; 
                    bestS = s; 
                }
            }
            
            if (bestDiff === Infinity) { bestS = maxS; }
            
            return { standard: bestS, double: d, totalHours: (bestS * CONSTANTS.stdShift) + (d * CONSTANTS.dblShift) };
        }

        function calculateTotals() {
            let totalTurnover = 0;
            let actualHours = 0;

            daysOfWeek.forEach(day => {
                const turnoverInput = document.getElementById(`turnover-${day}`);
                if(turnoverInput) totalTurnover += (parseFloat(turnoverInput.value) || 0);

                const fohHours = parseFloat(document.getElementById(`foh-staff-${day}`).getAttribute('data-hours')) || 0;
                const bohHours = parseFloat(document.getElementById(`boh-staff-${day}`).getAttribute('data-hours')) || 0;
                actualHours += (fohHours + bohHours);
            });

            if (totalTurnover > 0) {
                const actualSpend = actualHours * CONSTANTS.hourlyRate;
                const ratio = ((actualSpend / totalTurnover) * 100).toFixed(2);
                
                const ratioColor = ratio > 10.00 ? 'text-red-500' : 'text-emerald-400';
                
                document.getElementById('weeklySummary').innerHTML = 
                    `Total Turnover: <span class="text-white">R${totalTurnover.toFixed(2)}</span> &nbsp;|&nbsp; Actual Wage Spend: <span class="text-white">R${actualSpend.toFixed(2)}</span> &nbsp;|&nbsp; Actual Ratio: <span class="${ratioColor} font-bold">${ratio}%</span>`;
            } else {
                document.getElementById('weeklySummary').innerHTML = 
                    `Total Turnover: <span class="text-white">R0.00</span> &nbsp;|&nbsp; Actual Wage Spend: <span class="text-white">R0.00</span> &nbsp;|&nbsp; Actual Ratio: <span class="text-emerald-400">0.00%</span>`;
            }
        }

        function processRow(day) {
            const turnover = parseFloat(document.getElementById(`turnover-${day}`).value) || 0;
            
            const fohExactDbl = parseInt(document.getElementById(`foh-limit-${day}`).value) || 0;
            const bohExactDbl = parseInt(document.getElementById(`boh-limit-${day}`).value) || 0;

            if (turnover < 1000) {
                document.getElementById(`foh-staff-${day}`).textContent = "0";
                document.getElementById(`foh-staff-${day}`).setAttribute('data-hours', "0");
                document.getElementById(`foh-breakdown-${day}`).textContent = "(0 x 7h | 0 x 11h)";
                document.getElementById(`foh-bgt-${day}`).textContent = "R0";

                document.getElementById(`boh-staff-${day}`).textContent = "0";
                document.getElementById(`boh-staff-${day}`).setAttribute('data-hours', "0");
                document.getElementById(`boh-breakdown-${day}`).textContent = "(0 x 7h | 0 x 11h)";
                document.getElementById(`boh-bgt-${day}`).textContent = "R0";
            } else {
                const totalBudget = turnover * CONSTANTS.wagePercentageCap;
                const fohBudget = totalBudget * CONSTANTS.fohSplit;
                const bohBudget = totalBudget * CONSTANTS.bohSplit;

                const fohRoster = optimizeShiftsExact(fohBudget / CONSTANTS.hourlyRate, fohExactDbl, CONSTANTS.maxFohStaff);
                const bohRoster = optimizeShiftsExact(bohBudget / CONSTANTS.hourlyRate, bohExactDbl, CONSTANTS.maxBohStaff);

                const fohStaff = fohRoster.standard + fohRoster.double;
                const bohStaff = bohRoster.standard + bohRoster.double;

                const fohEl = document.getElementById(`foh-staff-${day}`);
                fohEl.textContent = fohStaff;
                fohEl.setAttribute('data-hours', fohRoster.totalHours);
                document.getElementById(`foh-breakdown-${day}`).textContent = `(${fohRoster.standard} x 7h  |  ${fohRoster.double} x 11h)`;
                document.getElementById(`foh-bgt-${day}`).textContent = `R${Math.round(fohBudget)}`;

                const bohEl = document.getElementById(`boh-staff-${day}`);
                bohEl.textContent = bohStaff;
                bohEl.setAttribute('data-hours', bohRoster.totalHours);
                document.getElementById(`boh-breakdown-${day}`).textContent = `(${bohRoster.standard} x 7h  |  ${bohRoster.double} x 11h)`;
                document.getElementById(`boh-bgt-${day}`).textContent = `R${Math.round(bohBudget)}`;
            }
            calculateTotals();
        }

        grid.addEventListener('input', (e) => {
            if (e.target.classList.contains('trigger-calc')) {
                const day = e.target.getAttribute('data-day');
                processRow(day);
            }
        });

        // Professional Document Generator
        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: "portrait", unit: "pt", format: "A4" });

            const dateFrom = document.getElementById('dateFrom').value || '____-___-__';
            const dateTo = document.getElementById('dateTo').value || '____-___-__';

            // --- LOGO INSERTION (Dynamically pulled from DOM) ---
            const logoEl = document.getElementById('pdfLogo');
            if (logoEl && logoEl.complete && logoEl.naturalWidth !== 0) {
                doc.addImage(logoEl, 'PNG', 380, 40, 160, 40);
            }

            // --- DOCUMENT HEADERS ---
            doc.setFontSize(22);
            doc.setFont("helvetica", "bold");
            doc.text("Sabino Canyon Spur", 40, 60);

            doc.setFontSize(14);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(100, 100, 100);
            doc.text("SAB Shift Predictions", 40, 80);
            doc.text(`${dateFrom} to ${dateTo}`, 40, 98);

            // --- ASSEMBLE GRID DATA ---
            const tableData = [];
            daysOfWeek.forEach(day => {
                const turnover = document.getElementById(`turnover-${day}`).value || "0";
                
                const fohStaff = document.getElementById(`foh-staff-${day}`).textContent;
                const fohBreakdown = document.getElementById(`foh-breakdown-${day}`).textContent;
                const foh7Match = fohBreakdown.match(/(\d+)\s*x\s*7h/);
                const foh11Match = fohBreakdown.match(/(\d+)\s*x\s*11h/);
                const foh7 = foh7Match ? foh7Match[1] : "0";
                const foh11 = foh11Match ? foh11Match[1] : "0";

                const bohStaff = document.getElementById(`boh-staff-${day}`).textContent;
                const bohBreakdown = document.getElementById(`boh-breakdown-${day}`).textContent;
                const boh7Match = bohBreakdown.match(/(\d+)\s*x\s*7h/);
                const boh11Match = bohBreakdown.match(/(\d+)\s*x\s*11h/);
                const boh7 = boh7Match ? boh7Match[1] : "0";
                const boh11 = boh11Match ? boh11Match[1] : "0";

                tableData.push([ day, `R ${turnover}`, fohStaff, foh7, foh11, bohStaff, boh7, boh11 ]);
            });

            // --- RENDER MAIN TABLE ---
            doc.autoTable({
                startY: 130,
                head: [
                    [
                        { content: 'Day', rowSpan: 2, styles: { valign: 'middle' } }, 
                        { content: 'Projected Turnover', rowSpan: 2, styles: { valign: 'middle' } }, 
                        { content: 'Front of House', colSpan: 3, styles: { halign: 'center' } }, 
                        { content: 'Back of House', colSpan: 3, styles: { halign: 'center' } }
                    ],
                    ['Total Staff', '7h', '11h', 'Total Staff', '7h', '11h']
                ],
                body: tableData,
                theme: 'grid',
                styles: { 
                    fontSize: 11, 
                    cellPadding: 8, 
                    textColor: [0, 0, 0] 
                },
                headStyles: { 
                    fillColor: [240, 240, 240], 
                    textColor: [0, 0, 0], 
                    fontStyle: 'bold' 
                },
                columnStyles: {
                    0: { fontStyle: 'bold' },
                    2: { halign: 'center' },
                    3: { halign: 'center' },
                    4: { halign: 'center' },
                    5: { halign: 'center' },
                    6: { halign: 'center' },
                    7: { halign: 'center' }
                },
                didDrawCell: function(data) {
                    // Inject thick vertical separation lines for FOH and BOH sections
                    if (data.column.index === 2 || data.column.index === 5) {
                        doc.setDrawColor(0, 0, 0); // Solid black stroke
                        doc.setLineWidth(1.5);
                        doc.line(data.cell.x, data.cell.y, data.cell.x, data.cell.y + data.cell.height);
                    }
                }
            });

            // --- RENDER EXECUTIVE SUMMARY ---
            let totalTurnover = 0;
            let actualHours = 0;
            daysOfWeek.forEach(day => {
                totalTurnover += parseFloat(document.getElementById(`turnover-${day}`).value) || 0;
                actualHours += parseFloat(document.getElementById(`foh-staff-${day}`).getAttribute('data-hours')) || 0;
                actualHours += parseFloat(document.getElementById(`boh-staff-${day}`).getAttribute('data-hours')) || 0;
            });

            const actualSpend = actualHours * CONSTANTS.hourlyRate;
            const ratio = totalTurnover > 0 ? ((actualSpend / totalTurnover) * 100).toFixed(2) : "0.00";
            const isOverBudget = parseFloat(ratio) > 10.00;

            const finalY = doc.lastAutoTable.finalY + 30;

            doc.autoTable({
                startY: finalY,
                head: [['Total Projected Turnover', 'Total Actual Wage Spend', 'Actual Wage/Turnover Ratio']],
                body: [[`R ${totalTurnover.toFixed(2)}`, `R ${actualSpend.toFixed(2)}`, `${ratio}%`]],
                theme: 'grid',
                headStyles: { fillColor: [40, 40, 40], textColor: [255, 255, 255], fontStyle: 'bold', halign: 'center' },
                bodyStyles: { fontSize: 13, fontStyle: 'bold', halign: 'center', cellPadding: 12 },
                didParseCell: function(data) {
                    if (data.section === 'body' && data.column.index === 2) {
                        data.cell.styles.textColor = isOverBudget ? [220, 38, 38] : [16, 185, 129];
                    }
                }
            });

            doc.save(`Spur_Roster_${dateFrom}_to_${dateTo}.pdf`);
        }

        buildGrid();
    </script>
</body>
</html>
